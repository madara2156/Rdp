services:
  - type: web
    name: bass-tg-store
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /ping
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEB_ADMIN_USERNAME
        sync: false
      - key: WEB_ADMIN_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: USDT_TRC20_ADDRESS
        sync: false
      - key: USDT_BEP20_ADDRESS
        sync: false
      - key: BINANCE_PAY_ID
        sync: false
      - key: ZAPUPI_API_KEY
        sync: false
      - key: ZAPUPI_INR_PER_USDT
        value: "90"
      - key: ZAPUPI_MIN_INR
        value: "90"
      - key: ZAPUPI_WEBHOOK_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: godmadara01
      - key: OTP_SESSIONS_DIR
        value: sessions
      - key: PYTHON_VERSION
        value: 3.11.9
